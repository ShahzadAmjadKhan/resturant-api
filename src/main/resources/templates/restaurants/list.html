<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Restaurants List</title>
</head>
<body>
    <div th:fragment="content">
        <h2>Restaurants</h2>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="restaurant : ${restaurants}">
                        <td th:text="${restaurant.id}"></td>
                        <td th:text="${restaurant.name}"></td>
                        <td>
                            <a th:href="@{/restaurants/{id}(id=${restaurant.id})}" class="btn btn-primary btn-sm">View</a>
                            <a th:href="@{/restaurants/{id}/edit(id=${restaurant.id})}" class="btn btn-warning btn-sm">Edit</a>
                            <button class="btn btn-danger btn-sm" 
                                    th:onclick="'deleteRestaurant(' + ${restaurant.id} + ')'">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function deleteRestaurant(id) {
            if (confirm('Are you sure you want to delete this restaurant?')) {
                fetch('/api/v1/restaurant/' + id, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        window.location.reload();
                    } else {
                        alert('Error deleting restaurant');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting restaurant');
                });
            }
        }
    </script>
</body>
</html>
