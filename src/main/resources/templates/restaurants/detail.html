<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Restaurant Details</title>
</head>
<body>
    <div th:fragment="content">
        <h2>Restaurant Details</h2>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title" th:text="${restaurant.name}">Restaurant Name</h5>
                <div class="mb-3">
                    <strong>Address:</strong>
                    <span th:text="${restaurant.address}">Address</span>
                </div>
                <div class="mb-3">
                    <strong>Cuisine:</strong>
                    <span th:text="${restaurant.cuisine}">Cuisine</span>
                </div>
                <div class="mb-3">
                    <strong>Rating:</strong>
                    <span th:text="${restaurant.rating}">Rating</span>
                </div>
                <div class="mt-3">
                    <a th:href="@{/restaurants/{id}/edit(id=${restaurant.id})}" class="btn btn-warning">Edit</a>
                    <button class="btn btn-danger" 
                            th:onclick="'deleteRestaurant(' + ${restaurant.id} + ')'">Delete</button>
                    <a href="/restaurants" class="btn btn-secondary">Back to List</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function deleteRestaurant(id) {
            if (confirm('Are you sure you want to delete this restaurant?')) {
                fetch('/api/v1/restaurant/' + id, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = '/restaurants';
                    } else {
                        alert('Error deleting restaurant');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting restaurant');
                });
            }
        }
    </script>
</body>
</html>
