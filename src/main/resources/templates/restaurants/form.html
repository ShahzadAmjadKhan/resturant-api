<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${restaurant != null ? 'Edit Restaurant' : 'Add Restaurant'}">Add Restaurant</title>
</head>
<body>
    <div th:fragment="content">
        <h2 th:text="${restaurant != null ? 'Edit Restaurant' : 'Add Restaurant'}">Add Restaurant</h2>
        <form id="restaurantForm" th:action="@{${restaurant != null ? '/restaurants/' + ${restaurant.id} : '/restaurants'}}" method="post">
            <input type="hidden" name="_method" th:value="${restaurant != null ? 'PUT' : 'POST'}">
            
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" 
                       th:value="${restaurant != null ? restaurant.name : ''}" required>
            </div>
            
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="address" 
                       th:value="${restaurant != null ? restaurant.address : ''}" required>
            </div>
            
            <div class="mb-3">
                <label for="cuisine" class="form-label">Cuisine</label>
                <input type="text" class="form-control" id="cuisine" name="cuisine" 
                       th:value="${restaurant != null ? restaurant.cuisine : ''}" required>
            </div>
            
            <div class="mb-3">
                <label for="rating" class="form-label">Rating</label>
                <input type="number" class="form-control" id="rating" name="rating" 
                       th:value="${restaurant != null ? restaurant.rating : ''}" min="1" max="5" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/restaurants" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

    <script>
        document.getElementById('restaurantForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                name: formData.get('name'),
                address: formData.get('address'),
                cuisine: formData.get('cuisine'),
                rating: parseInt(formData.get('rating'))
            };
            
            const method = formData.get('_method');
            const url = this.action;
            
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/restaurants';
                } else {
                    alert('Error saving restaurant');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error saving restaurant');
            });
        });
    </script>
</body>
</html>
